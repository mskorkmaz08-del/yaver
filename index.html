<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Yaver</title>
  <meta name="description" content="Yaver, your personal assistant for money, meetings, studies and diet.">
  <meta name="theme-color" content="#0b0d14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Yaver">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <link rel="modulepreload" href="vendor/anthropic-sdk.js">
</head>
<body>
  <main id="view" class="view"></main>

  <button id="fab" class="fab" aria-label="Ask Yaver"><span class="orb"></span></button>

  <nav class="tabbar" aria-label="Sections">
    <button data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg><span>Home</span></button>
    <button data-tab="money"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="1.3"/></svg><span>Money</span></button>
    <button data-tab="calendar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/><path d="M8 13.5h3"/></svg><span>Meetings</span></button>
    <span class="tab-gap"></span>
    <button data-tab="study"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5c3-1 5.5-.5 8 1.5 2.5-2 5-2.5 8-1.5v13c-3-1-5.5-.5-8 1.5-2.5-2-5-2.5-8-1.5z"/><path d="M12 7v12.5"/></svg><span>Study</span></button>
    <button data-tab="diet"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21c-4.5 0-7.5-3.4-7.5-7.6C4.5 9 7.5 7 10 7.6c1 .2 1.5.6 2 .6s1-.4 2-.6c2.5-.6 5.5 1.4 5.5 5.8 0 4.2-3 7.6-7.5 7.6z"/><path d="M12 8c0-2 1-4 3-5"/></svg><span>Diet</span></button>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
