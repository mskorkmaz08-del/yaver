<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Yaver</title>
  <meta name="description" content="Yaver, your personal assistant for money, meetings, studies and diet.">
  <meta name="theme-color" content="#0f1215">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Yaver">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <link rel="modulepreload" href="vendor/anthropic-sdk.js">
</head>
<body>
  <main id="view" class="view"></main>

  <button id="fab" class="fab" aria-label="Ask Yaver"><span class="fab-gear" data-gear="button" aria-hidden="true"></span></button>

  <span id="sync-dot" class="sync-dot" hidden></span>

  <div id="topbar" class="topbar" aria-hidden="true"><span></span></div>

  <nav class="tabbar" aria-label="Sections">
    <div class="side-brand side-only"><span class="brand-gear" data-gear="button" data-ratio="-4" aria-hidden="true"></span><b class="wordmark">Yaver</b></div>
    <i class="tab-mark" aria-hidden="true"></i>
    <button data-tab="home"></button>
    <button data-tab="cetele"></button>
    <button data-tab="study"></button>
    <span></span>
    <button data-tab="calendar"></button>
    <button data-tab="money"></button>
    <button data-tab="diet"></button>
    <button class="side-only" data-tab="map"></button>
    <button class="side-only" data-tab="skills"></button>
    <div class="side-gauge side-only" data-gauge></div>
    <button class="side-ask side-only" data-ask></button>
    <button class="side-cmd side-only" data-cmd></button>
    <button class="side-only" data-tab="settings"></button>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
