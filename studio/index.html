<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yaver Studio has moved</title>
  <meta http-equiv="refresh" content="0; url=https://mskorkmaz08-del.github.io/yaver-m2/" />
  <style>body{margin:0;display:grid;place-items:center;height:100vh;background:#07090f;color:#d8e6f5;font:15px system-ui,sans-serif}a{color:#4cc9ff}</style>
</head>
<body>
  <p>Yaver Studio is now its own app, Yaver Mark II: <a href="https://mskorkmaz08-del.github.io/yaver-m2/">open it here</a>.</p>
  <script>
    // Remove the old Studio service worker, then go to the new home.
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (r) { if (r.scope.indexOf("/studio/") !== -1) r.unregister(); });
      });
    }
    location.replace("https://mskorkmaz08-del.github.io/yaver-m2/");
  </script>
</body>
</html>
